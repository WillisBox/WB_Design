<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WB Design</title>
<meta name="theme-color" content="#1546A8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WB Design">
<style>
  html,body{margin:0;height:100%;background:#EEF3FC;overflow:hidden;font-family:system-ui,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #muat{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
        background:linear-gradient(160deg,#2F6FDE,#123E97)}
  #muat img{width:128px;border-radius:28px;background:#fff;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:d 1.4s ease-in-out infinite}
  @keyframes d{50%{transform:translateY(-6px)}}
  #muat b{color:#fff;font-size:20px;letter-spacing:.08em;margin-top:10px}
  #muat i{color:#DCE7FF;font-size:13px}
  #pasang{display:none;position:fixed;left:16px;right:16px;bottom:90px;z-index:9;padding:14px 0;border:0;border-radius:12px;
          background:linear-gradient(135deg,#2F6FDE,#1546A8);color:#fff;font-weight:800;font-size:16px;box-shadow:0 8px 20px rgba(21,70,168,.35)}
</style>
</head>
<body>
<div id="muat"><img src="logo.png" alt="WB Design"><b>WILLIS BOX</b><i>Memuat form design...</i></div>
<iframe id="form" title="WB Design"
  src="https://script.google.com/macros/s/AKfycbyuHNEjXuHy_ObxDI0co97H3wtesT7nWELvQWYYqFPW6WuxYVohPZvJyBxG96XyiFOA2w/exec"
  onload="document.getElementById('muat').style.display='none'"></iframe>
<button id="pasang">INSTAL APLIKASI WB DESIGN</button>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  // Tombol instal muncul bila Chrome menawarkan pemasangan
  let tawaran = null;
  const btn = document.getElementById('pasang');
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); tawaran = e; btn.style.display = 'block'; });
  btn.onclick = async () => { if (!tawaran) return; tawaran.prompt(); await tawaran.userChoice; tawaran = null; btn.style.display = 'none'; };
  window.addEventListener('appinstalled', () => { btn.style.display = 'none'; });
</script>
</body>
</html>
